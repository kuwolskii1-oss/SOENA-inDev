<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="The avenues of SOENA — journeys, callings, encounters, guidance, community, testimony, experience, consolidation — each re-voiced for the path you actually walk." />
    <meta name="theme-color" content="#fbfff9" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>The Avenues — SOENA</title>
    <style>
      /* Critical shell: paints the garden before any bundle arrives. */
      /* Palette tokens — the site's whole colour world, switchable from
         the memory panel's developer options. Defined here as well as in
         the bundle so the first painted frame is already in-palette.
         The loading veil keeps ONE look per palette on purpose: it must
         not invert when the visitor happens to be in dark mode. */
      :root {
        color-scheme: light;
        --bg: #fbfff9; --ink: #04231c;
        --wash-bg-rgb: 251, 255, 249; --wash-ink-rgb: 4, 35, 28;
        --wash-tint-rgb: 173, 245, 188; --wash-glow-rgb: 199, 244, 84;
        --veil-ground: #04231c; --veil-word: #fbfff9;
        --veil-line: #c7f454; --veil-line-glow: rgba(199, 244, 84, 0.55);
      }
      html[data-palette='tide'] {
        --bg: #e9f1ef; --ink: #011f27;
        --wash-bg-rgb: 233, 241, 239; --wash-ink-rgb: 1, 31, 39;
        --wash-tint-rgb: 102, 172, 145; --wash-glow-rgb: 246, 210, 133;
        --veil-ground: #011f27; --veil-word: #e9f1ef;
        --veil-line: #f6d285; --veil-line-glow: rgba(246, 210, 133, 0.55);
      }
      html[data-theme='dark'] { color-scheme: dark; --bg: #04231c; --ink: #fbfff9; }
      html[data-palette='tide'][data-theme='dark'] { --bg: #011f27; --ink: #e9f1ef; }
      html { background: var(--bg); }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      /* The canopy overhead: the day or night still. */
      #backdrop {
        position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        background: var(--bg) center / cover no-repeat url('./bg/canopy-day.webp');
      }
      [data-theme='dark'] #backdrop { background-image: url('./bg/canopy-night.webp'); }
      /* Frosted panes: vertical glass sheets between canopy and page.
         Opaqueness is the visitor's frost level (Developer options). */
      :root { --frost-blur: 12px; --frost-wash: 1; --frost-tint: 0; --frost-scale: 1; }
      html[data-frost='1'] { --frost-blur: 0px; --frost-wash: 0.55; --frost-tint: 0; }
      html[data-frost='2'] { --frost-blur: 5px; --frost-wash: 0.8; --frost-tint: 0; }
      html[data-frost='4'] { --frost-blur: 20px; --frost-tint: 0.09; }
      html[data-frost='5'] { --frost-blur: 30px; --frost-tint: 0.2; }
      #panes { position: fixed; inset: 0; z-index: 0; display: flex; pointer-events: none; }
      .pane {
        height: 100%;
        --pane-tint-rgb: var(--wash-bg-rgb);
        backdrop-filter: blur(calc(var(--frost-blur) * var(--pane-m, 1) * var(--frost-scale))) saturate(1.06);
        -webkit-backdrop-filter: blur(calc(var(--frost-blur) * var(--pane-m, 1) * var(--frost-scale))) saturate(1.06);
        background: rgba(var(--pane-tint-rgb), calc(var(--frost-tint) * var(--pane-m, 1)));
        box-shadow: inset -1px 0 0 rgba(var(--wash-bg-rgb), 0.28);
      }
      .pane:nth-child(1) { width: 24%; --pane-m: 0.55; }
      .pane:nth-child(2) { width: 30%; --pane-m: 1.2; }
      .pane:nth-child(3) { width: 24%; --pane-m: 0.8; }
      .pane:nth-child(4) { width: 22%; --pane-m: 1.4; box-shadow: none; }
      [data-theme='dark'] .pane {
        --pane-tint-rgb: var(--wash-ink-rgb);
        box-shadow: inset -1px 0 0 rgba(var(--wash-bg-rgb), 0.14);
      }
      [data-theme='dark'] .pane:nth-child(4) { box-shadow: none; }
      /* The wash above the panes: legibility tint, following the level. */
      #aura {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        opacity: min(1, var(--frost-wash));
        background:
          radial-gradient(70rem 54rem at 60% 38%, rgba(var(--wash-bg-rgb), 0.5), transparent 70%),
          radial-gradient(44rem 40rem at 22% 82%, rgba(var(--wash-tint-rgb), 0.22), transparent 65%),
          radial-gradient(34rem 30rem at 78% 18%, rgba(var(--wash-glow-rgb), 0.12), transparent 60%),
          linear-gradient(rgba(var(--wash-bg-rgb), 0.32), rgba(var(--wash-bg-rgb), 0.4));
      }
      [data-theme='dark'] #aura {
        background:
          radial-gradient(70rem 54rem at 60% 38%, rgba(var(--wash-ink-rgb), 0.24), transparent 70%),
          radial-gradient(44rem 40rem at 22% 82%, rgba(var(--wash-ink-rgb), 0.34), transparent 65%),
          linear-gradient(rgba(var(--wash-ink-rgb), 0.22), rgba(var(--wash-ink-rgb), 0.4));
      }
      [data-theme='dark'] #avenues-hero p { color: rgba(var(--wash-bg-rgb), .66); }
      #avenues-hero {
        position: relative; z-index: 1; min-height: 38vh;
        display: grid; place-content: end start; gap: 0.6rem;
        padding: 7rem 6vw 0;
      }
      #avenues-hero h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.6rem); font-weight: 500; }
      #avenues-hero p { margin: 0; max-width: 44ch; color: rgba(var(--wash-ink-rgb), .66); line-height: 1.6; }
      noscript p { color: rgba(var(--wash-ink-rgb), .85); max-width: 40ch; margin: 2rem auto; text-align: center; }
      /* Brief arrival curtain — same door as the landing, half the
         ceremony: the wordmark sits quietly, the light-line stretches,
         the veil lifts as soon as the type is ready. */
      #arrival {
        position: fixed; inset: 0; z-index: 120;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        background: var(--veil-ground);
      }
      .has-arrival #arrival { display: flex; }
      html.has-arrival:not(.arrival-done) { overflow: hidden; }
      .arrival-word {
        margin: 0; color: var(--veil-word);
        font-family: 'Fraunces Variable', Georgia, 'Times New Roman', serif;
        font-weight: 480; letter-spacing: 0.32em; text-indent: 0.32em;
      }
      #arrival.arrival--brief .arrival-word { font-size: clamp(1.3rem, 3.4vw, 1.8rem); }
      #arrival.arrival--brief .arrival-word span { display: inline-block; }
      .arrival-line {
        width: min(7rem, 26vw); height: 2px; margin-top: 1.15rem;
        background: var(--veil-line); border-radius: 2px;
        box-shadow: 0 0 18px var(--veil-line-glow);
        transform: scaleX(0);
        transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s;
      }
      #arrival.is-lit .arrival-line { transform: scaleX(1); }
      html.arrival-done #arrival {
        transform: translateY(-101%); pointer-events: none;
        transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .arrival-line { transition-duration: 0.01s; }
        html.arrival-done #arrival {
          transform: none; opacity: 0; visibility: hidden;
          transition: opacity 0.25s linear, visibility 0s linear 0.25s;
        }
      }
    </style>
    <script>
      // Restore the chosen theme before first paint.
      try {
        if (localStorage.getItem('soena.theme.v1') === 'dark')
          document.documentElement.dataset.theme = 'dark';
        var p = localStorage.getItem('soena.palette.v1');
        if (p) document.documentElement.dataset.palette = p;
        var f = localStorage.getItem('soena.frost.v1');
        if (f) document.documentElement.dataset.frost = f;
      } catch (e) {}
      // Veil only when JS runs; failsafe lift at 4s if the app never boots.
      document.documentElement.classList.add('has-arrival');
      window.__soenaArrival = setTimeout(function () {
        document.documentElement.classList.add('arrival-done');
      }, 4000);
    </script>
    <script type="module" src="/src/avenues-page.ts"></script>
  </head>
  <body data-presence-scale="0.55">
    <div id="arrival" class="arrival--brief" aria-hidden="true">
      <p class="arrival-word"><span>S</span><span>O</span><span>E</span><span>N</span><span>A</span></p>
      <span class="arrival-line"></span>
    </div>
    <div id="backdrop" aria-hidden="true"></div>
    <div id="panes" aria-hidden="true"><span class="pane"></span><span class="pane"></span><span class="pane"></span><span class="pane"></span></div>
    <div id="aura" aria-hidden="true"></div>
    <canvas id="gl" aria-hidden="true"></canvas>

    <header id="site-head" hidden>
      <a class="skip-link" href="#journeys">Skip to the avenues</a>
      <a class="brand brand--link" href="./index.html">SOENA</a>
      <nav id="ways" aria-label="Avenues"></nav>
      <div class="head-actions">
        <button id="voice-toggle" type="button" aria-pressed="false" title="Let SOENA speak aloud">voice</button>
        <button id="memory-open" type="button" title="What SOENA remembers">memory</button>
      </div>
    </header>

    <main id="app">
      <section id="avenues-hero" aria-label="The avenues">
        <h1>The Avenues</h1>
        <p>Eight ways through — walk them in any order, at any pace. I will keep alongside.</p>
        <noscript><p>The avenues need JavaScript to be walked with company; the words are still here without it.</p></noscript>
      </section>
    </main>

    <div id="caption" role="status" aria-live="polite"></div>
    <div id="overlay-root"></div>
  </body>
</html>
