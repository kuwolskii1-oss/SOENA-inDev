<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="The avenues of SOENA — journeys, callings, encounters, guidance, community, testimony, experience, consolidation — each re-voiced for the path you actually walk." />
    <meta name="theme-color" content="#fbfff9" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>The Avenues — SOENA</title>
    <style>
      /* Critical shell: paints the garden before any bundle arrives. */
      :root { color-scheme: light; }
      html { background: #fbfff9; }
      html[data-theme='dark'] { background: #04231c; color-scheme: dark; }
      body {
        margin: 0;
        background: #fbfff9;
        color: #04231c;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      [data-theme='dark'] body { background: #04231c; color: #fbfff9; }
      /* The canopy overhead: day or night still, aura wash above it. */
      #backdrop {
        position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        background: #fbfff9 center / cover no-repeat url('./bg/canopy-day.webp');
      }
      [data-theme='dark'] #backdrop {
        background-color: #04231c;
        background-image: url('./bg/canopy-night.webp');
      }
      #aura {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(70rem 54rem at 60% 38%, rgba(251, 255, 249, 0.58), transparent 70%),
          radial-gradient(44rem 40rem at 22% 82%, rgba(173, 245, 188, 0.24), transparent 65%),
          linear-gradient(rgba(251, 255, 249, 0.4), rgba(232, 244, 233, 0.46));
      }
      [data-theme='dark'] #aura {
        background:
          radial-gradient(70rem 54rem at 60% 38%, rgba(4, 35, 28, 0.26), transparent 70%),
          radial-gradient(44rem 40rem at 22% 82%, rgba(4, 35, 28, 0.36), transparent 65%),
          linear-gradient(rgba(4, 35, 28, 0.26), rgba(4, 35, 28, 0.44));
      }
      [data-theme='dark'] #avenues-hero p { color: rgba(251,255,249,.66); }
      #avenues-hero {
        position: relative; z-index: 1; min-height: 38vh;
        display: grid; place-content: end start; gap: 0.6rem;
        padding: 7rem 6vw 0;
      }
      #avenues-hero h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.6rem); font-weight: 500; }
      #avenues-hero p { margin: 0; max-width: 44ch; color: rgba(4,35,28,.66); line-height: 1.6; }
      noscript p { color: rgba(4,35,28,.85); max-width: 40ch; margin: 2rem auto; text-align: center; }
      /* Brief arrival curtain — same door as the landing, half the
         ceremony: the wordmark sits quietly, the light-line stretches,
         the veil lifts as soon as the type is ready. */
      #arrival {
        position: fixed; inset: 0; z-index: 120;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        background: #04231c;
      }
      .has-arrival #arrival { display: flex; }
      html.has-arrival:not(.arrival-done) { overflow: hidden; }
      .arrival-word {
        margin: 0; color: #fbfff9;
        font-family: 'Fraunces Variable', Georgia, 'Times New Roman', serif;
        font-weight: 480; letter-spacing: 0.32em; text-indent: 0.32em;
      }
      #arrival.arrival--brief .arrival-word { font-size: clamp(1.3rem, 3.4vw, 1.8rem); }
      #arrival.arrival--brief .arrival-word span { display: inline-block; }
      .arrival-line {
        width: min(7rem, 26vw); height: 2px; margin-top: 1.15rem;
        background: #c7f454; border-radius: 2px;
        box-shadow: 0 0 18px rgba(199, 244, 84, 0.55);
        transform: scaleX(0);
        transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.05s;
      }
      #arrival.is-lit .arrival-line { transform: scaleX(1); }
      html.arrival-done #arrival {
        transform: translateY(-101%); pointer-events: none;
        transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .arrival-line { transition-duration: 0.01s; }
        html.arrival-done #arrival {
          transform: none; opacity: 0; visibility: hidden;
          transition: opacity 0.25s linear, visibility 0s linear 0.25s;
        }
      }
    </style>
    <script>
      // Restore the chosen theme before first paint.
      try {
        if (localStorage.getItem('soena.theme.v1') === 'dark')
          document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
      // Veil only when JS runs; failsafe lift at 4s if the app never boots.
      document.documentElement.classList.add('has-arrival');
      window.__soenaArrival = setTimeout(function () {
        document.documentElement.classList.add('arrival-done');
      }, 4000);
    </script>
    <script type="module" src="/src/avenues-page.ts"></script>
  </head>
  <body>
    <div id="arrival" class="arrival--brief" aria-hidden="true">
      <p class="arrival-word"><span>S</span><span>O</span><span>E</span><span>N</span><span>A</span></p>
      <span class="arrival-line"></span>
    </div>
    <div id="backdrop" aria-hidden="true"></div>
    <div id="aura" aria-hidden="true"></div>
    <canvas id="gl" aria-hidden="true"></canvas>

    <header id="site-head" hidden>
      <a class="skip-link" href="#journeys">Skip to the avenues</a>
      <a class="brand brand--link" href="./index.html">SOENA</a>
      <nav id="ways" aria-label="Avenues"></nav>
      <div class="head-actions">
        <button id="voice-toggle" type="button" aria-pressed="false" title="Let SOENA speak aloud">voice</button>
        <button id="memory-open" type="button" title="What SOENA remembers">memory</button>
      </div>
    </header>

    <main id="app">
      <section id="avenues-hero" aria-label="The avenues">
        <h1>The Avenues</h1>
        <p>Eight ways through — walk them in any order, at any pace. I will keep alongside.</p>
        <noscript><p>The avenues need JavaScript to be walked with company; the words are still here without it.</p></noscript>
      </section>
    </main>

    <div id="caption" role="status" aria-live="polite"></div>
    <div id="overlay-root"></div>
  </body>
</html>
