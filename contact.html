<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Reach SOENA — a short conversation at the door instead of a form. Your words travel only by your hand." />
    <meta name="theme-color" content="#07060d" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Reach SOENA</title>
    <style>
      /* Critical shell: paints before any bundle arrives. */
      :root { color-scheme: dark; }
      html { background: #07060d; }
      body {
        margin: 0;
        background: #07060d;
        color: #efeaf7;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      #aura {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(42rem 42rem at 50% 38%, rgba(124, 108, 255, 0.16), transparent 62%),
          radial-gradient(30rem 30rem at 62% 46%, rgba(64, 186, 255, 0.07), transparent 60%);
      }
      #reach-hero {
        position: relative; z-index: 1; min-height: 46vh;
        display: grid; place-content: end center; text-align: center; gap: 1rem;
        padding: 7rem 1.5rem 0;
      }
      #reach-hero h1 {
        font-size: clamp(2.2rem, 7vw, 4.6rem);
        font-weight: 500; letter-spacing: 0.14em; text-indent: 0.14em;
        margin: 0;
      }
      #reach-hero p { margin: 0 auto; max-width: 40ch; color: rgba(239,234,247,.62); line-height: 1.6; }
      noscript p { color: rgba(239,234,247,.85); max-width: 40ch; margin: 2rem auto; text-align: center; }
    </style>
    <script type="module" src="/src/contact.ts"></script>
  </head>
  <body data-presence-anchor="-0.95">
    <div id="aura" aria-hidden="true"></div>
    <canvas id="gl" aria-hidden="true"></canvas>

    <header id="site-head">
      <a class="skip-link" href="#reach">Skip to the conversation</a>
      <a class="brand brand--link" href="./index.html">SOENA</a>
      <nav id="ways" aria-label="Pages">
        <a class="external-page-link" href="./index.html">the door</a>
      </nav>
      <div class="head-actions">
        <button id="voice-toggle" type="button" aria-pressed="false" title="Let SOENA speak aloud">voice</button>
        <button id="memory-open" type="button" title="What SOENA remembers">memory</button>
      </div>
    </header>

    <main id="app">
      <section id="reach-hero" aria-label="Reach SOENA">
        <h1>Reach the door</h1>
        <p>No forms, no queues. A short conversation, then a letter — sent by your own hand.</p>
        <noscript><p>The conversation needs JavaScript. You can always write directly instead.</p></noscript>
      </section>
      <section id="reach" class="reach" aria-label="The conversation"></section>
    </main>

    <div id="caption" role="status" aria-live="polite"></div>
    <div id="overlay-root"></div>
  </body>
</html>
