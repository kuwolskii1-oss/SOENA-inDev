<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SOENA is a companion at the door — a quiet presence that ushers you through journeys, callings, encounters, guidance, community, testimony, experience and consolidation, whatever shape your path takes." />
    <meta name="theme-color" content="#d7d8da" />
    <meta property="og:title" content="SOENA — a companion at the door" />
    <meta property="og:description" content="A spiritual-journey companion for every kind of path — theistic, non-theistic, philosophical, psychological, emotional." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>SOENA — a companion at the door</title>
    <style>
      /* Critical shell: paints the studio before any bundle arrives. */
      :root { color-scheme: light; }
      html { background: #d7d8da; }
      body {
        margin: 0;
        background: #d7d8da;
        color: #17171b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      #aura {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          radial-gradient(70rem 54rem at 64% 40%, rgba(255, 255, 255, 0.9), transparent 70%),
          radial-gradient(40rem 40rem at 30% 70%, rgba(139, 123, 255, 0.10), transparent 65%),
          linear-gradient(#d9dadc, #cfd0d3);
      }
      #boot-hero {
        position: relative; z-index: 1;
        min-height: 100vh; min-height: 100svh;
        display: flex; align-items: center;
        padding: 0 6vw;
      }
      .hero-left { max-width: 26rem; }
      .hero-brand {
        position: fixed; top: 1.05rem; left: 1.4rem; z-index: 11;
        margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.01em;
      }
      .hero-brand sup { font-size: 0.55em; }
      #hero-line {
        margin: 0 0 1.4rem;
        font-size: clamp(1.45rem, 3.2vw, 2.1rem);
        line-height: 1.3; font-weight: 500;
        text-wrap: balance;
      }
      #hero-chips { display: flex; flex-wrap: wrap; gap: 0.55rem; }
      noscript p { color: rgba(23,23,27,.8); max-width: 40ch; margin: 2rem 0; }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-presence-anchor="0.55">
    <div id="aura" aria-hidden="true"></div>
    <canvas id="gl" aria-hidden="true"></canvas>

    <h1 class="hero-brand">SOENA<sup>®</sup></h1>

    <header id="site-head" hidden>
      <a class="skip-link" href="#avenues">Skip to the avenues</a>
      <nav id="ways" aria-label="Avenues"></nav>
      <div class="head-actions">
        <button id="chat-open" type="button" title="Talk with SOENA">let’s talk</button>
        <button id="voice-toggle" type="button" aria-pressed="false" title="Let SOENA speak aloud">voice</button>
        <button id="memory-open" type="button" title="What SOENA remembers">memory</button>
      </div>
    </header>

    <main id="app">
      <section id="boot-hero" aria-label="SOENA greets you">
        <div class="hero-left">
          <p id="hero-line">Oh — a knock. I am SOENA, the companion at this door. Whoever you are, however you believe or don’t: you can come in.</p>
          <div id="hero-chips"></div>
          <noscript>
            <p>
              SOENA is an interactive companion and needs JavaScript to walk with you.
              The door is still here — journeys, callings, encounters, guidance,
              community, testimony, experience, consolidation — whenever you return
              with scripts allowed.
            </p>
          </noscript>
        </div>
      </section>
    </main>

    <div id="caption" role="status" aria-live="polite"></div>
    <div id="overlay-root"></div>
  </body>
</html>
