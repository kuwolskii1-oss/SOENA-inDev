<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SOENA is a companion at the door — a quiet presence that ushers you through journeys, callings, encounters, guidance, community, testimony, experience and consolidation, whatever shape your path takes." />
    <meta name="theme-color" content="#fbfff9" />
    <meta property="og:title" content="SOENA — a companion at the door" />
    <meta property="og:description" content="A spiritual-journey companion for every kind of path — theistic, non-theistic, philosophical, psychological, emotional." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>SOENA — a companion at the door</title>
    <style>
      /* Critical shell: paints the garden before any bundle arrives.
         The landing is one still screen — no scrolling. */
      /* Palette tokens — the site's whole colour world, switchable from
         the memory panel's developer options. Defined here as well as in
         the bundle so the first painted frame is already in-palette.
         The loading veil keeps ONE look per palette on purpose: it must
         not invert when the visitor happens to be in dark mode. */
      :root {
        color-scheme: light;
        --bg: #fbfff9; --ink: #04231c;
        --wash-bg-rgb: 251, 255, 249; --wash-ink-rgb: 4, 35, 28;
        --wash-tint-rgb: 173, 245, 188; --wash-glow-rgb: 199, 244, 84;
        --veil-ground: #04231c; --veil-word: #fbfff9;
        --veil-line: #c7f454; --veil-line-glow: rgba(199, 244, 84, 0.55);
      }
      html[data-palette='tide'] {
        --bg: #e9f1ef; --ink: #011f27;
        --wash-bg-rgb: 233, 241, 239; --wash-ink-rgb: 1, 31, 39;
        --wash-tint-rgb: 102, 172, 145; --wash-glow-rgb: 246, 210, 133;
        --veil-ground: #011f27; --veil-word: #e9f1ef;
        --veil-line: #f6d285; --veil-line-glow: rgba(246, 210, 133, 0.55);
      }
      html[data-theme='dark'] { color-scheme: dark; --bg: #04231c; --ink: #fbfff9; }
      html[data-palette='tide'][data-theme='dark'] { --bg: #011f27; --ink: #e9f1ef; }
      html { background: var(--bg); }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        height: 100vh; height: 100svh;
        overflow: hidden;
      }
      /* The canopy overhead: the day or night still. */
      #backdrop {
        position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        background: var(--bg) center / cover no-repeat url('./bg/canopy-day.webp');
        filter: blur(calc(var(--frost-blur) * var(--frost-scale))) saturate(1.06);
        transform: scale(1.08);
      }
      [data-theme='dark'] #backdrop { background-image: url('./bg/canopy-night.webp'); }
      /* The frosted glass: ONE continuous sheet over the canopy at a
         single uniform strength — no sections, no seams. The visitor's
         frost level (Developer options) picks the strength. */
      :root { --frost-blur: 12px; --frost-wash: 1; --frost-tint: 0; --frost-scale: 1; }
      html[data-frost='1'] { --frost-blur: 0px; --frost-wash: 0.55; --frost-tint: 0; }
      html[data-frost='2'] { --frost-blur: 5px; --frost-wash: 0.8; --frost-tint: 0; }
      html[data-frost='4'] { --frost-blur: 20px; --frost-tint: 0.1; }
      html[data-frost='5'] { --frost-blur: 30px; --frost-tint: 0.22; }
      #glass {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background: rgba(var(--wash-bg-rgb), var(--frost-tint));
      }
      [data-theme='dark'] #glass { background: rgba(var(--wash-ink-rgb), var(--frost-tint)); }
      /* The wash above the glass: legibility tint, following the level. */
      #aura {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        opacity: min(1, var(--frost-wash));
        background:
          radial-gradient(70rem 54rem at 60% 38%, rgba(var(--wash-bg-rgb), 0.5), transparent 70%),
          radial-gradient(44rem 40rem at 22% 82%, rgba(var(--wash-tint-rgb), 0.22), transparent 65%),
          radial-gradient(34rem 30rem at 78% 18%, rgba(var(--wash-glow-rgb), 0.12), transparent 60%),
          linear-gradient(rgba(var(--wash-bg-rgb), 0.32), rgba(var(--wash-bg-rgb), 0.4));
      }
      [data-theme='dark'] #aura {
        background:
          radial-gradient(70rem 54rem at 60% 38%, rgba(var(--wash-ink-rgb), 0.24), transparent 70%),
          radial-gradient(44rem 40rem at 22% 82%, rgba(var(--wash-ink-rgb), 0.34), transparent 65%),
          linear-gradient(rgba(var(--wash-ink-rgb), 0.22), rgba(var(--wash-ink-rgb), 0.4));
      }
      #boot-hero {
        position: relative; z-index: 1;
        height: 100vh; height: 100svh;
        display: flex; align-items: center;
        padding: 0 6vw 14vh;
      }
      /* Words hold the centre; the bottom-left corner belongs to SOENA. */
      .hero-left { max-width: 28rem; margin-inline: auto; }
      .hero-brand {
        position: fixed; top: 0.95rem; left: 1.4rem; z-index: 11;
        margin: 0; font-size: 1.26rem; font-weight: 600; letter-spacing: 0.01em;
      }
      .hero-brand sup { font-size: 0.55em; }
      #hero-line {
        margin: 0 0 1.4rem;
        font-size: clamp(1.4rem, 3vw, 2rem);
        line-height: 1.32; font-weight: 500;
        text-wrap: balance;
      }
      #hero-chips { display: flex; flex-wrap: wrap; gap: 0.55rem; }
      noscript p { color: rgba(var(--wash-ink-rgb), .8); max-width: 40ch; margin: 2rem 0; }
      /* The arrival veil — the door, closed for one breath. Painted from
         this critical CSS so it is there on the very first frame, shown
         only when JS runs (html.has-arrival), lifted by the app once the
         type has loaded and the layout beneath has settled. */
      #arrival {
        position: fixed; inset: 0; z-index: 120;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        background: var(--veil-ground);
      }
      .has-arrival #arrival { display: flex; }
      .arrival-word {
        margin: 0; color: var(--veil-word);
        font-family: 'Fraunces Variable', Georgia, 'Times New Roman', serif;
        font-weight: 480; font-size: clamp(1.9rem, 5.4vw, 3.1rem);
        letter-spacing: 0.32em; text-indent: 0.32em;
      }
      .arrival-word span {
        display: inline-block; opacity: 0; transform: translateY(0.55em);
        transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #arrival.is-lit .arrival-word span { opacity: 1; transform: none; }
      #arrival.is-lit .arrival-word span:nth-child(2) { transition-delay: 60ms; }
      #arrival.is-lit .arrival-word span:nth-child(3) { transition-delay: 120ms; }
      #arrival.is-lit .arrival-word span:nth-child(4) { transition-delay: 180ms; }
      #arrival.is-lit .arrival-word span:nth-child(5) { transition-delay: 240ms; }
      .arrival-line {
        width: min(9rem, 30vw); height: 2px; margin-top: 1.4rem;
        background: var(--veil-line); border-radius: 2px;
        box-shadow: 0 0 18px var(--veil-line-glow);
        transform: scaleX(0);
        transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1) 0.12s;
      }
      #arrival.is-lit .arrival-line { transform: scaleX(1); }
      html.arrival-done #arrival {
        transform: translateY(-101%); pointer-events: none;
        transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .arrival-word span, .arrival-line { transition-duration: 0.01s; }
        html.arrival-done #arrival {
          transform: none; opacity: 0; visibility: hidden;
          transition: opacity 0.25s linear, visibility 0s linear 0.25s;
        }
      }
    </style>
    <script>
      // Restore the chosen theme before first paint, so night visitors
      // never see a white flash.
      try {
        if (localStorage.getItem('soena.theme.v1') === 'dark')
          document.documentElement.dataset.theme = 'dark';
        // Always explicit: each palette is a world with its own CSS.
        document.documentElement.dataset.palette =
          localStorage.getItem('soena.palette.v1') === 'tide' ? 'tide' : 'garden';
        var f = localStorage.getItem('soena.frost.v1');
        if (f && '12345'.indexOf(f) >= 0 && f.length === 1)
          document.documentElement.dataset.frost = f;
      } catch (e) {}
      // Match the browser chrome to whatever ground we just restored.
      try {
        var m = document.querySelector('meta[name=theme-color]');
        if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      } catch (e) {}
      // Gate the veil on JS actually running, so a scriptless visitor never
      // faces a closed door; and lift it after 4s even if the app never
      // arrives. The app clears this failsafe the moment it boots.
      document.documentElement.classList.add('has-arrival');
      window.__soenaArrival = setTimeout(function () {
        document.documentElement.classList.add('arrival-done');
      }, 4000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body data-presence-scale="0.38">
    <div id="arrival" aria-hidden="true">
      <p class="arrival-word"><span>S</span><span>O</span><span>E</span><span>N</span><span>A</span></p>
      <span class="arrival-line"></span>
    </div>
    <div id="backdrop" aria-hidden="true"></div>
    <div id="glass" aria-hidden="true"></div>
    <div id="aura" aria-hidden="true"></div>
    <canvas id="gl" aria-hidden="true"></canvas>

    <h1 class="hero-brand">SOENA<sup>®</sup></h1>

    <header id="site-head" hidden>
      <a class="skip-link" href="#hero-chips">Skip to the choices</a>
      <nav id="ways" aria-label="Avenues"></nav>
      <div class="head-actions">
        <button id="voice-toggle" type="button" aria-pressed="false" title="Let SOENA speak aloud">voice</button>
        <button id="memory-open" type="button" title="What SOENA remembers">memory</button>
      </div>
    </header>

    <main id="app">
      <section id="boot-hero" aria-label="SOENA greets you">
        <div class="hero-left">
          <div id="hero-ghosts" aria-hidden="true"></div>
          <p id="hero-line">Oh — a knock. I am SOENA, the companion at this door. Whoever you are, however you believe or don’t: you can come in.</p>
          <div id="hero-chips"></div>
          <noscript>
            <p>
              SOENA is an interactive companion and needs JavaScript to walk with you.
              The avenues — journeys, callings, encounters, guidance, community,
              testimony, experience, consolidation — are at ./avenues.html whenever
              you return with scripts allowed.
            </p>
          </noscript>
        </div>
      </section>
    </main>

    <div id="caption" role="status" aria-live="polite"></div>
    <div id="overlay-root"></div>
  </body>
</html>
